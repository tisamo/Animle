<div class="container" *ngIf="this.quiz">
  <div class="title-row">
    <div>
      <h4>Guess the <span class="green">name</span> of the anime</h4>
      <h5>By  <span class="green">{{quiz?.type}}</span></h5>
    </div>
    <div class="timer" *ngIf="!gameStarted">00:{{20 - time}}</div>
  </div>
  <div class="input-box">
    <input #input [readonly]="gameStarted" [formControl]="inputControl" placeholder="Type here after game started" >
    <div class="list">
      <div class="list-item" *ngFor="let item of searchList; let i = index"
           [ngClass]="{'grey': i === selectedItemIndex}"
           (click)="selectAnswer(item.id)" >{{item.title}} </div>
    </div>
  </div>
  <section class="game-container">
    <div *ngIf="!gameStarted; else start ">
      <div *ngIf="quiz?.type == GameType.Image">
        <app-image-quiz [time]="time" [image]="quiz.image"></app-image-quiz>
      </div>
      <div *ngIf="quiz?.type == GameType.Word">
        <app-description-quiz [time]="time" [words]="quiz.words" ></app-description-quiz>
      </div>

      <div *ngIf="quiz?.type == GameType.Emoji">
        <app-emoji-quiz [emojis]="quiz.emojiDescription" [time]="time" ></app-emoji-quiz>
      </div>
    </div>
  </section>

  <ng-template #start>
    <h1 (click)="startGame()">
      Play again
    </h1>
  </ng-template>

</div>
<div class="loading-screen" *ngIf="quiz == null">
      Looking for opponents
</div>
